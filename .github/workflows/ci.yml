name: CI

on:
  pull_request:
  push:
    branches: [master, develop]

jobs:
  lint:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install linters
        run: |
          brew update
          brew install swiftlint swift-format
      - name: Run lint
        run: ./scripts/lint.sh

  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Build
        run: ./scripts/build.sh

  # Tests target macOS 26 (Tahoe). GitHub-hosted macos-26 runners are not yet GA;
  # enable this job once they ship, or run via self-hosted Apple Silicon runner.
