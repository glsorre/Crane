name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Import Developer ID certificate
        env:
          CERT_B64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERT_PW: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KC_PW: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH=$(mktemp -t cert).p12
          echo "$CERT_B64" | base64 -d > "$CERT_PATH"
          if [ ! -s "$CERT_PATH" ]; then
            echo "Decoded cert is empty — check MACOS_CERTIFICATE_P12_BASE64 secret" >&2
            exit 1
          fi
          file "$CERT_PATH"
          KC=build.keychain
          security create-keychain -p "$KC_PW" "$KC"
          security default-keychain -s "$KC"
          security unlock-keychain -p "$KC_PW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security import "$CERT_PATH" -k "$KC" -P "$CERT_PW" -f pkcs12 \
              -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
              -s -k "$KC_PW" "$KC"
          security list-keychains -d user -s "$KC" login.keychain
          rm -f "$CERT_PATH"
          security find-identity -v -p codesigning "$KC"

      - name: Build and sign
        env:
          DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
        run: ./scripts/build-release.sh

      - name: Notarize and staple app
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          API_KEY_B64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
        run: ./scripts/notarize.sh

      - name: Package, sign, notarize DMG
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: ./scripts/make-dmg.sh

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: RightCrane-dmg
          path: build/RightCrane-*.dmg

      - name: Attach DMG to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/RightCrane-*.dmg
          generate_release_notes: true
          draft: true
